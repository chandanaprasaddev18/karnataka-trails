# Guides — Chikkamagaluru district.
#
# ------------------------------------------------------------------------
# ALL PLACEHOLDERS. NONE OF THESE ARE REAL PEOPLE.
#
# Guide records are personal data plus a commercial relationship, so inventing
# plausible names and numbers would be actively harmful — a traveller could try
# to contact someone who does not exist, and a real person's number could be
# guessed into the file by accident.
#
# Every row here is therefore explicitly synthetic: source='placeholder',
# confidence=1, empty contact, and a name that reads as a role rather than a
# person. They exist only so the engine and the frontend can exercise the
# "guide details where available" path end to end.
#
# Before publishing any of these: replace with a real guide who has consented
# to being listed, fill `contact`, set is_verified, and raise `confidence`.
# Anything still marked source='placeholder' must NOT be promoted.
# ------------------------------------------------------------------------

