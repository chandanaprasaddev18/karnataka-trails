# Places to visit — Chikkamagaluru district.
#
# ------------------------------------------------------------------------
# THIS IS A DRAFT SEED SET AND NEEDS A FACT-CHECK PASS.
#
# Everything here is hand-compiled from general knowledge, loads as
# status='draft', and is INVISIBLE to the itinerary engine until promoted with
# `make publish`. Treat every field as a claim to verify, in this order:
#   1. coords            — a wrong coordinate silently corrupts every route
#   2. entry_fee_paise   — money, and it changes
#   3. duration_minutes  — the engine budgets whole days against this
#   4. best_months       — drives the seasonal filter
# `confidence` is my own estimate, 1 (guess) to 5 (certain):
#   3 = well-known landmark, coordinates and name I am confident in
#   2 = exists and is correctly named, but a detail here is likely imprecise
# ------------------------------------------------------------------------
#
# All money is integer PAISE (100 paise = 1 rupee), so 3000 = ₹30.
# `cost` is [min, max]. `tags` maps an interest_tags slug to a weight 1-100;
# the weight is what makes stage 1 rank a real peak above a gentle garden walk
# for the same 'trekking' tag.

# --- the Chandra Drona range, above Chikkamagaluru town ---------------------

- slug: mullayanagiri
  name: Mullayanagiri
  region: chikkamagaluru-taluk
  coords: [13.3917, 75.7186]
  summary: The highest peak in Karnataka at 1,930 m, reached by a short stepped climb.
  description: >-
    The summit of the Chandra Drona range and the highest point in the state. A
    motorable road climbs most of the way; the last stretch is a flight of steps
    to a small Shiva shrine on the top. Mornings before about nine are clear;
    after that the ridge usually fills with cloud.
  duration_minutes: 150
  cost_band: 1
  cost: [0, 5000]
  difficulty: 2
  best_months: [10, 11, 12, 1, 2, 3]
  tags: {trekking: 95, nature: 85, photography: 90, offbeat: 30}
  source: hand_compiled
  confidence: 3
  place:
    type: viewpoint
    best_time_of_day: sunrise
    entry_fee_paise: 3000
    requires_permit: false

- slug: baba-budangiri
  name: Baba Budangiri
  region: chikkamagaluru-taluk
  coords: [13.4167, 75.7333]
  summary: A ridge shrine revered by both Hindus and Muslims, on a long open plateau.
  description: >-
    Also called Dattapeetha. The cave shrine is associated with the Sufi saint
    Baba Budan, who is credited with bringing coffee to India, and is venerated
    by both communities. The drive up runs along an exposed grassland ridge with
    long views on both sides.
  duration_minutes: 120
  cost_band: 1
  cost: [0, 3000]
  difficulty: 1
  best_months: [10, 11, 12, 1, 2, 3]
  tags: {spiritual: 90, trekking: 60, nature: 70, heritage: 55, photography: 70}
