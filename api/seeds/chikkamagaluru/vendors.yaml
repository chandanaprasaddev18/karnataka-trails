# Vendors and their products — Chikkamagaluru district.
#
# ------------------------------------------------------------------------
# ALL PLACEHOLDERS. NONE OF THESE ARE REAL BUSINESSES.
#
# Same rule as `guides.yaml`, for the same reason, one step worse: a vendor is a
# commercial party a traveller might try to PAY. Inventing a plausible estate name
# and number could send money or a phone call to someone who does not exist, or
# — by accident — to a real trader who never agreed to be listed.
#
# So every row here is explicitly synthetic: source='placeholder', confidence=1,
# empty contact, and a name that reads as a role rather than a business. `publish`
# refuses them, so the marketplace shows the district's specialities and says
# plainly that it lists no sellers yet.
#
# They exist for one reason: so the vendor -> product -> tag -> region path is
# exercised end to end in local development, via
# `tripplan publish --include-placeholders`.
#
# TO ADD A REAL VENDOR: get their consent, fill `contact` and `address`, set
# source to something checkable (their own site, a co-operative register), raise
# confidence, and set verified_at once a human has spoken to them. Anything still
# marked source='placeholder' must NOT be promoted.
# ------------------------------------------------------------------------

