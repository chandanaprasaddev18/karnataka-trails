# --- season (used by stage 1 alongside pois.best_months) -------------------
- slug: monsoon
  label: Monsoon
  kind: season
  display_order: 10
  description: June to September; waterfalls at full flow, trails often closed.
- slug: post-monsoon
  label: Post-monsoon
  kind: season
  display_order: 20
  description: October to November; the clearest views of the year.
- slug: winter
  label: Winter
  kind: season
  display_order: 30
  description: December to February; peak season, cold mornings.
- slug: summer
  label: Summer
  kind: season
  display_order: 40
  description: March to May; hot in the valleys, still pleasant on the ridges.

# --- product categories (Phase 5) -------------------------------------------
# What a place produces. These are facts about the district, independent of any
# seller: `region_specialities` ties them to a region, and a vendor's products
# hang off the same tag when a real vendor exists.
#
# Kept deliberately coarse. "Arabica coffee" is checkable; "artisanal
# single-origin microlot" is a sales pitch, and this taxonomy is not for selling.

- slug: coffee-beans
  label: Coffee
  kind: product_category
  display_order: 500
  description: Arabica and robusta from the estates that cover this district.

- slug: spices
  label: Spices
  kind: product_category
  display_order: 510
  description: Pepper, cardamom and areca grown between the coffee rows.

- slug: honey
  label: Forest honey
  kind: product_category
  display_order: 520
  description: Wild and apiary honey from the Ghats.

- slug: jaggery
  label: Jaggery
  kind: product_category
  display_order: 530
  description: Cane and palm jaggery, pressed locally in season.

- slug: handloom
  label: Handloom & crafts
  kind: product_category
  display_order: 540
  description: Woven cotton, cane and bamboo work.

- slug: preserves
  label: Preserves
  kind: product_category
  display_order: 550
  description: Fruit, bamboo shoot and gooseberry preparations made at home.
