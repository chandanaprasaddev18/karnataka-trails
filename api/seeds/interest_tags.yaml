# The shared taxonomy. One vocabulary, partitioned by `kind`.
#
# `interest` tags are the user-facing selection ("Plan by Interest").
# `audience` and `season` tags are seeded but not exposed in the UI.
# `product_category` tags are Phase 5's marketplace vocabulary — added as ROWS in
# this same file, which is the whole payoff of partitioning one taxonomy by `kind`
# in migration 001 instead of building a second one.
#
# display_order controls the order of the chips in the wizard.

- slug: trekking
  label: Trekking
  kind: interest
  display_order: 10
  description: Peak climbs, ridge walks and forest trails.

- slug: spiritual
  label: Spiritual
  kind: interest
  display_order: 20
  description: Temples, mathas and pilgrimage towns.

- slug: adventurous
  label: Adventurous
  kind: interest
  display_order: 30
  description: Rafting, off-roading and high-adrenaline activities.

- slug: nature
  label: Nature & Waterfalls
  kind: interest
  display_order: 40
  description: Waterfalls, valleys, viewpoints and scenic drives.

- slug: wildlife
  label: Wildlife
  kind: interest
  display_order: 50
  description: Sanctuaries, safaris and birding hides.

- slug: coffee-country
  label: Coffee Country
  kind: interest
  display_order: 60
  description: Working plantations, estate walks and cupping sessions.

- slug: heritage
  label: Heritage
  kind: interest
  display_order: 70
  description: Temples of architectural note, forts and inscriptions.

- slug: relaxation
  label: Relaxation
  kind: interest
  display_order: 80
  description: Slow stays, estate verandahs and short easy outings.

- slug: photography
  label: Photography
  kind: interest
  display_order: 90
  description: Sunrise points, mist, and long-lens landscapes.

- slug: offbeat
  label: Offbeat
  kind: interest
  display_order: 100
  description: Lesser-visited places that need a little effort to reach.

